server {
    listen 80;
    server_name lsp-ui.ibnuapps.cloud;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lsp-ui.ibnuapps.cloud;

    root /var/www/lsp-ui/public;
    index index.php index.html;

    # SSL - will be updated by certbot
    ssl_certificate /etc/letsencrypt/live/ibnuapps.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibnuapps.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    error_log /var/log/nginx/lsp-ui.error.log;
    access_log /var/log/nginx/lsp-ui.access.log;
}
