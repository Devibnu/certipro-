; ============================================================
; CERTIPRO QUEUE WORKER - SUPERVISOR CONFIGURATION
; ============================================================
; Path: /etc/supervisor/conf.d/certipro-queue.conf
;
; Setup Instructions:
; 1. Copy this file to /etc/supervisor/conf.d/
; 2. Update 'command' path to match your installation
; 3. Update 'user' if different from www-data
; 4. Run: sudo supervisorctl reread
; 5. Run: sudo supervisorctl update
; 6. Run: sudo supervisorctl start certipro-queue-notifications:*
;
; ============================================================

[program:certipro-queue-notifications]
; Process name with numbering (allows multiple workers)
process_name=%(program_name)s_%(process_num)02d

; Command to run queue worker
; IMPORTANT: Update /var/www/lsp-ui.ibnuapps.cloud/current to your actual path
command=php /var/www/lsp-ui.ibnuapps.cloud/current/artisan queue:work database --queue=notifications --tries=1 --timeout=120 --sleep=3 --max-jobs=1000 --max-time=3600

; Start automatically when supervisor starts
autostart=true

; Restart automatically if crashes
autorestart=true

; User to run the worker as (must have write permissions to storage/)
user=www-data

; Number of worker processes (2 = can process 2 jobs simultaneously)
; Adjust based on server resources:
; - Low traffic: numprocs=1
; - Medium traffic: numprocs=2-3
; - High traffic: numprocs=5-10
numprocs=2

; Redirect stderr to stdout
redirect_stderr=true

; Log file location
; IMPORTANT: Ensure directory exists and is writable
stdout_logfile=/var/www/lsp-ui.ibnuapps.cloud/current/storage/logs/queue-notifications.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Time to wait for graceful shutdown before killing (in seconds)
; 3600s = 1 hour (allows long-running jobs to complete)
stopwaitsecs=3600

; Priority (lower number = higher priority)
priority=999

; Environment variables (if needed)
; environment=LARAVEL_ENV="production"

; ============================================================
; ALTERNATIVE: Redis Queue (for high-traffic production)
; ============================================================
; Uncomment below and comment out database worker above
; if using Redis for better performance
;
; [program:certipro-queue-notifications-redis]
; process_name=%(program_name)s_%(process_num)02d
; command=php /var/www/lsp-ui.ibnuapps.cloud/current/artisan queue:work redis --queue=notifications --tries=1 --timeout=120 --sleep=3 --max-jobs=1000 --max-time=3600
; autostart=true
; autorestart=true
; user=www-data
; numprocs=3
; redirect_stderr=true
; stdout_logfile=/var/www/lsp-ui.ibnuapps.cloud/current/storage/logs/queue-notifications-redis.log
; stdout_logfile_maxbytes=10MB
; stdout_logfile_backups=3
; stopwaitsecs=3600

; ============================================================
; OPTIONAL: Separate workers for email and WhatsApp
; ============================================================
; For very high traffic, you can separate email and WhatsApp
; into different workers for better resource allocation
;
; [program:certipro-queue-email]
; process_name=%(program_name)s_%(process_num)02d
; command=php /var/www/lsp-ui.ibnuapps.cloud/current/artisan queue:work database --queue=email --tries=5 --timeout=120 --sleep=3
; autostart=true
; autorestart=true
; user=www-data
; numprocs=2
; redirect_stderr=true
; stdout_logfile=/var/www/lsp-ui.ibnuapps.cloud/current/storage/logs/queue-email.log
;
; [program:certipro-queue-whatsapp]
; process_name=%(program_name)s_%(process_num)02d
; command=php /var/www/lsp-ui.ibnuapps.cloud/current/artisan queue:work database --queue=whatsapp --tries=3 --timeout=60 --sleep=3
; autostart=true
; autorestart=true
; user=www-data
; numprocs=2
; redirect_stderr=true
; stdout_logfile=/var/www/lsp-ui.ibnuapps.cloud/current/storage/logs/queue-whatsapp.log

; ============================================================
; MANAGEMENT COMMANDS
; ============================================================
; # View status
; sudo supervisorctl status
;
; # Start workers
; sudo supervisorctl start certipro-queue-notifications:*
;
; # Stop workers
; sudo supervisorctl stop certipro-queue-notifications:*
;
; # Restart workers
; sudo supervisorctl restart certipro-queue-notifications:*
;
; # Reload configuration
; sudo supervisorctl reread
; sudo supervisorctl update
;
; # View logs
; sudo supervisorctl tail -f certipro-queue-notifications
;
; # Clear logs
; sudo supervisorctl clear certipro-queue-notifications
;
; ============================================================
